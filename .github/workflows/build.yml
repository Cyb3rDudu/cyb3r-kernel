name: Build cyb3r-kernel on Asahi release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Asahi kernel tag (e.g. asahi-7.1.5-1)'
        required: true
        default: 'asahi-7.1.5-1'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Build kernel
        run: |
          nix build \
            --override-input asahi-kernel "github:AsahiLinux/linux?ref=${{ inputs.tag }}" \
            .#packages.aarch64-linux.default \
            -o kernel-result

      - name: Package artifacts
        run: |
          mkdir release
          cp kernel-result/Image release/
          cp kernel-result/System.map release/ 2>/dev/null || true
          tar -czf "kernel-${{ inputs.tag }}-arm64.tar.gz" -C release .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          body: |
            cyb3r-kernel build from Asahi Linux ${{ inputs.tag }}
            
            Patches applied:
            - asahi-nightlight (GNOME Night Light)
            - agx-show-fdinfo (GPU telemetry via fdinfo)
          files: kernel-${{ inputs.tag }}-arm64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.tag }}-arm64
          path: kernel-${{ inputs.tag }}-arm64.tar.gz
